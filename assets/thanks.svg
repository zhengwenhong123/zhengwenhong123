<!-- https://github.com/DenverCoder1/readme-typing-svg/ -->
<svg xmlns='http://www.w3.org/2000/svg'
    xmlns:xlink='http://www.w3.org/1999/xlink'
    viewBox='0 0 600 80'
    style='background-color: #00000000;'
    width='600px' height='80px'>

    <style>
@font-face {
  font-family: 'Space Grotesk';
  font-style: normal;
  font-weight: 600;
  font-display: fallback;
  src: url(data:font/truetype;base64,) format('truetype');
}
</style>

                    <path id='path0'>
                            <!-- Multiline -->
                                <animate id='d0' attributeName='d' begin='0s;d1.end'
                    dur='4500ms' fill="freeze"
                    values='m0,27 h0 ; m0,27 h0 ; m0,27 h600 ; m0,27 h600' keyTimes='0;0;0.55555555555556;1' />
                    </path>
    <text font-family='"Space Grotesk", monospace' fill='#7C4DFF' font-size='22'
        dominant-baseline='middle'
        x='50%' text-anchor='middle'
        letter-spacing='normal'>
        <textPath xlink:href='#path0'>
            Thanks for visiting!
        </textPath>
    </text>
        <path id='path1'>
                            <!-- Multiline -->
                                <animate id='d1' attributeName='d' begin='0s;d1.end'
                    dur='9000ms' fill="freeze"
                    values='m0,54 h0 ; m0,54 h0 ; m0,54 h600 ; m0,54 h600' keyTimes='0;0.5;0.77777777777778;1' />
                    </path>
    <text font-family='"Space Grotesk", monospace' fill='#7C4DFF' font-size='22'
        dominant-baseline='middle'
        x='50%' text-anchor='middle'
        letter-spacing='normal'>
        <textPath xlink:href='#path1'>
            Let&#039;s build something useful.
        </textPath>
    </text>
</svg>
