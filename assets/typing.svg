<!-- https://github.com/DenverCoder1/readme-typing-svg/ -->
<svg xmlns='http://www.w3.org/2000/svg'
    xmlns:xlink='http://www.w3.org/1999/xlink'
    viewBox='0 0 800 100'
    style='background-color: #00000000;'
    width='800px' height='100px'>

    <style>
@font-face {
  font-family: 'Space Grotesk';
  font-style: normal;
  font-weight: 600;
  font-display: fallback;
  src: url(data:font/truetype;base64,) format('truetype');
}
</style>

                    <path id='path0'>
                            <!-- Multiline -->
                                <animate id='d0' attributeName='d' begin='0s;d2.end'
                    dur='4500ms' fill="freeze"
                    values='m0,27 h0 ; m0,27 h0 ; m0,27 h800 ; m0,27 h800' keyTimes='0;0;0.66666666666667;1' />
                    </path>
    <text font-family='"Space Grotesk", monospace' fill='#7C4DFF' font-size='22'
        dominant-baseline='middle'
        x='50%' text-anchor='middle'
        letter-spacing='normal'>
        <textPath xlink:href='#path0'>
            AI Explorer | Knowledge Architect
        </textPath>
    </text>
        <path id='path1'>
                            <!-- Multiline -->
                                <animate id='d1' attributeName='d' begin='0s;d2.end'
                    dur='9000ms' fill="freeze"
                    values='m0,54 h0 ; m0,54 h0 ; m0,54 h800 ; m0,54 h800' keyTimes='0;0.5;0.83333333333333;1' />
                    </path>
    <text font-family='"Space Grotesk", monospace' fill='#7C4DFF' font-size='22'
        dominant-baseline='middle'
        x='50%' text-anchor='middle'
        letter-spacing='normal'>
        <textPath xlink:href='#path1'>
            Building Smart Tools with Code
        </textPath>
    </text>
        <path id='path2'>
                            <!-- Multiline -->
                                <animate id='d2' attributeName='d' begin='0s;d2.end'
                    dur='13500ms' fill="freeze"
                    values='m0,81 h0 ; m0,81 h0 ; m0,81 h800 ; m0,81 h800' keyTimes='0;0.66666666666667;0.88888888888889;1' />
                    </path>
    <text font-family='"Space Grotesk", monospace' fill='#7C4DFF' font-size='22'
        dominant-baseline='middle'
        x='50%' text-anchor='middle'
        letter-spacing='normal'>
        <textPath xlink:href='#path2'>
            Agents | Knowledge | Interactive Web
        </textPath>
    </text>
</svg>
